events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20M;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    
    # Upstream API
    upstream api {
        server api:8080;
    }
    
    # HTTP - Redirect to HTTPS
    server {
        listen 80;
        server_name api.locsafe.org;
        
        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        # Redirect everything else to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }
    
    # HTTPS - API Server
    server {
        listen 443 ssl http2;
        server_name api.locsafe.org;
        
        # SSL certificates
        ssl_certificate /etc/letsencrypt/live/api.locsafe.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.locsafe.org/privkey.pem;
        
        # Basic SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        
        # Security headers
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        
        # Proxy all requests to API
        location / {
            # CORS is handled by the Go API, so we don't add headers here
            # to avoid duplication
            
            # Proxy settings
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            proxy_pass http://api/health;
        }
    }
}